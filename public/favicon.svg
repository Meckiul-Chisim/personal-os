<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <title>Personal OS</title>
  <defs>
    <linearGradient id="po-tile" x1="10" y1="4" x2="54" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9bdcba"/>
      <stop offset="1" stop-color="#2f7352"/>
    </linearGradient>
    <radialGradient id="po-light" cx="0" cy="0" r="1" gradientTransform="translate(18 10) rotate(50) scale(46)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".42"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Tile: soft green gradient with a light glow in the top-left corner -->
  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#po-tile)"/>
  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#po-light)"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="16.5" stroke="#fff" stroke-opacity=".28"/>

  <!-- Mark: a ring (your life, in one place) with a stem that makes it a "p", and a focus dot -->
  <path d="M22.5 27V47" stroke="#fff" stroke-width="5.5" stroke-linecap="round"/>
  <circle cx="32" cy="27" r="9.5" stroke="#fff" stroke-width="5.5"/>
  <circle cx="32" cy="27" r="2.6" fill="#fff"/>
</svg>

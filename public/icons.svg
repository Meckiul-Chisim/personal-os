<svg xmlns="http://www.w3.org/2000/svg">
  <!--
    Personal OS logo sprite. Use any symbol with:
      <svg width="32" height="32"><use href="/icons.svg#po-logo" /></svg>

    po-logo       Green tile. The main logo, for light backgrounds and general use.
    po-logo-dark  Night-sky tile with a mint mark, for dark backgrounds.
    po-mark       The mark only, drawn in currentColor so it takes any text colour.
  -->

  <symbol id="po-logo" viewBox="0 0 64 64" fill="none">
    <defs>
      <linearGradient id="po-sprite-tile" x1="10" y1="4" x2="54" y2="62" gradientUnits="userSpaceOnUse">
        <stop stop-color="#9bdcba"/>
        <stop offset="1" stop-color="#2f7352"/>
      </linearGradient>
      <radialGradient id="po-sprite-light" cx="0" cy="0" r="1" gradientTransform="translate(18 10) rotate(50) scale(46)" gradientUnits="userSpaceOnUse">
        <stop stop-color="#fff" stop-opacity=".42"/>
        <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#po-sprite-tile)"/>
    <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#po-sprite-light)"/>
    <rect x="2.5" y="2.5" width="59" height="59" rx="16.5" stroke="#fff" stroke-opacity=".28"/>
    <path d="M22.5 27V47" stroke="#fff" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="32" cy="27" r="9.5" stroke="#fff" stroke-width="5.5"/>
    <circle cx="32" cy="27" r="2.6" fill="#fff"/>
  </symbol>

  <symbol id="po-logo-dark" viewBox="0 0 64 64" fill="none">
    <defs>
      <linearGradient id="po-sprite-night" x1="10" y1="4" x2="54" y2="62" gradientUnits="userSpaceOnUse">
        <stop stop-color="#1c2548"/>
        <stop offset="1" stop-color="#0b1020"/>
      </linearGradient>
      <radialGradient id="po-sprite-glow" cx="0" cy="0" r="1" gradientTransform="translate(22 12) rotate(50) scale(46)" gradientUnits="userSpaceOnUse">
        <stop stop-color="#8fd3b0" stop-opacity=".26"/>
        <stop offset="1" stop-color="#8fd3b0" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#po-sprite-night)"/>
    <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#po-sprite-glow)"/>
    <rect x="2.5" y="2.5" width="59" height="59" rx="16.5" stroke="#fff" stroke-opacity=".16"/>
    <path d="M22.5 27V47" stroke="#8fd3b0" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="32" cy="27" r="9.5" stroke="#8fd3b0" stroke-width="5.5"/>
    <circle cx="32" cy="27" r="2.6" fill="#c9f0dc"/>
  </symbol>

  <symbol id="po-mark" viewBox="0 0 64 64" fill="none">
    <path d="M22.5 27V47" stroke="currentColor" stroke-width="5.5" stroke-linecap="round"/>
    <circle cx="32" cy="27" r="9.5" stroke="currentColor" stroke-width="5.5"/>
    <circle cx="32" cy="27" r="2.6" fill="currentColor"/>
  </symbol>
</svg>
